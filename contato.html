<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Papeliar Papelaria</title>
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contato">
  <main>
    <div class="container contato-pagina">
      <div class="contato-layout">
        <section class="contato-info">
          <span class="rotulo">Fale conosco</span>
          <h1>Contato</h1>
          <p>Tem alguma dúvida sobre produtos, pedidos ou atendimento corporativo? Envie sua mensagem para a nossa equipe.</p>
          <ul class="contato-canais">
            <li>
              <span class="icone"><svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2Z"/></svg></span>
              <span><small>Telefone</small><span id="contato-telefone"></span></span>
            </li>
            <li>
              <span class="icone"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
              <span><small>E-mail</small><span id="contato-email"></span></span>
            </li>
            <li>
              <span class="icone"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg></span>
              <span><small>Localização</small>Recife – PE</span>
            </li>
          </ul>
        </section>

        <form class="contato-form" id="form-contato" novalidate>
          <h2>Envie sua dúvida</h2>
          <p>Preencha os campos abaixo.</p>
          <div class="campos">
            <div class="campo">
              <label for="nome">Nome</label>
              <input type="text" id="nome" name="nome" autocomplete="name" placeholder="Seu nome">
            </div>
            <div class="campo">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" autocomplete="email" placeholder="seuemail@exemplo.com">
            </div>
            <div class="campo inteiro">
              <label for="duvida">Sua dúvida</label>
              <textarea id="duvida" name="duvida" placeholder="Escreva sua mensagem"></textarea>
            </div>
          </div>
          <button type="button" class="botao botao-azul botao-grande">Enviar</button>
        </form>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.getElementById('contato-telefone').textContent = CONTATO.telefone;
    document.getElementById('contato-email').textContent = CONTATO.email;
    // O botão de enviar ainda não tem função; evita envio pelo Enter
    document.getElementById('form-contato').addEventListener('submit', e => e.preventDefault());
  </script>
</body>
</html>
